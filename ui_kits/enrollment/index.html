<!-- @dsCard group="Enrollment" viewport="360x700" name="Enrollment flow" subtitle="Welcome → Insurance → Address → Thank you (click through)" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head><body style="margin:0;background:#F4F4F4">
<div id="root"></div>
<script type="text/babel" data-presets="react" src="./WelcomeScreen.jsx"></script>
<script type="text/babel" data-presets="react" src="./InsuranceScreen.jsx"></script>
<script type="text/babel" data-presets="react" src="./AddressPaymentScreen.jsx"></script>
<script type="text/babel" data-presets="react" src="./ThankYouScreen.jsx"></script>
<script type="text/babel">
function App(){
  const [step, setStep] = React.useState(0);
  const screens = [
    <WelcomeScreen onNext={()=>setStep(1)} />,
    <InsuranceScreen onNext={()=>setStep(2)} onBack={()=>setStep(0)} />,
    <AddressPaymentScreen onNext={()=>setStep(3)} onBack={()=>setStep(1)} />,
    <ThankYouScreen onRestart={()=>setStep(0)} />,
  ];
  return (<div style={{minHeight:'100vh',background:'#fff',maxWidth:400,margin:'0 auto',boxShadow:'0 0 24px rgba(0,0,0,0.08)'}}>{screens[step]}</div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
